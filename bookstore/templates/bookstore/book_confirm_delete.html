{% extends "bookstore/base.html" %}
{% block title %}Delete {{ book.title }}{% endblock %}
{% block content %}
<div class="detail">
    <h2>Delete "{{ book.title }}"?</h2>
    <p style="margin-top:12px;">Are you sure you want to delete this book? This cannot be undone.</p>
    <form method="post" class="actions" style="margin-top:20px;">
        {% csrf_token %}
        <button type="submit" class="btn-danger">Yes, delete</button>
        <a class="btn btn-secondary" href="{% url 'book_detail' book.pk %}">Cancel</a>
    </form>
</div>
{% endblock %}
